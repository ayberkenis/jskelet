<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="referrer" content="no-referrer" />
    <title>Cache · JSkelet</title>
    <link rel="icon" href="logo.png" />
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body class="login">
    <form id="form" autocomplete="off">
      <div class="brand">
        <img src="logo.png" alt="" width="30" height="30" />
        <span class="wordmark">JSkelet</span>
        <span id="language"></span>
      </div>
      <h1 data-i18n="login.title">Cache panel</h1>
      <p data-i18n-html="login.lead"></p>
      <input
        id="password"
        type="password"
        name="password"
        maxlength="64"
        spellcheck="false"
        autocomplete="off"
        data-i18n-ph="login.placeholder"
        autofocus
      />
      <button class="primary" type="submit" data-i18n="login.submit">Unlock</button>
      <p class="error" id="error"></p>
      <p class="hint m0" data-i18n="login.hint"></p>
    </form>

    <script type="module">
      import { applyTranslations, languageSelect, t } from "./i18n.js";

      const form = document.getElementById("form");
      const input = document.getElementById("password");
      const error = document.getElementById("error");

      // Giriş sayfasında da seçici var: panele girmeden önce dilini seçen biri
      // içeride aynı dili bulmalı, tercih `localStorage`'da taşınıyor.
      document
        .getElementById("language")
        .append(languageSelect(() => applyTranslations()));

      applyTranslations();

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        error.textContent = "";

        const response = await fetch("login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: input.value }),
        });

        if (response.ok) {
          location.reload();
          return;
        }

        // Yasaklandıysa sunucu artık 404 dönüyor; kalan deneme sayısı
        // bilinçli olarak bildirilmiyor.
        error.textContent = t(response.status === 404 ? "login.tooMany" : "login.invalid");
        input.value = "";
        input.focus();
      });
    </script>
  </body>
</html>
